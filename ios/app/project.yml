# Application iPhone « Mes Courses » (recette) : coquille SwiftUI minimale qui affiche les écrans communs (Compose Multiplatform).
# Projet Xcode généré sur le Mac de CI par XcodeGen (aucun fichier .xcodeproj dans le dépôt).
name: Courses
options:
  bundleIdPrefix: app.smartcourse
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Courses:
    type: application
    platform: iOS
    sources:
      - path: Courses
        excludes: ["Info-final.plist", "*.entitlements"]
    preBuildScripts:
      - name: Framework Kotlin (écrans et règles communs)
        script: |
          cd "$SRCROOT/.."
          # Variante (recette / finale), serveur et version transmis aux écrans communs (BuildConfig généré).
          ./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode -Pfinal="$COURSES_FINAL" -PserverUrl="$COURSES_SERVER_URL" \
            -PversionName="$MARKETING_VERSION" -PversionCode="$CURRENT_PROJECT_VERSION"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Courses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "CoursesShared", "-framework", "Security", "-framework", "Network", "-lsqlite3"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      configs:
        # Recette (Debug) : application « Mes Courses (recette) », serveur choisi au lancement, accès des contrôles automatiques.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.smartcourse.courses.recette
          INFOPLIST_FILE: Courses/Info.plist
          COURSES_FINAL: "0"
        # Version finale (Release) : TestFlight / App Store. Identifiant, équipe Apple et serveur fournis par le workflow TestFlight.
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(COURSES_BUNDLE_ID)
          COURSES_BUNDLE_ID: app.smartcourse.courses
          INFOPLIST_FILE: Courses/Info-final.plist
          CODE_SIGN_ENTITLEMENTS: Courses/Courses-final.entitlements
          COURSES_FINAL: "1"
  CoursesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CoursesUITests]
    dependencies:
      - target: Courses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smartcourse.courses.recette.uitests
        TEST_TARGET_NAME: Courses
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Courses:
    build:
      targets:
        Courses: all
        CoursesUITests: [test]
    test:
      targets: [CoursesUITests]
