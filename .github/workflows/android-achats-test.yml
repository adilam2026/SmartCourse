name: Android — version de TEST des achats (Google Play, test interne, serveur de recette)
# Bundle AAB signé par la clé durable, identifiant RÉEL (app.smartcourse.courses.natif : obligatoire pour Google Play Billing), mais
# relié au serveur de RECETTE (données fictives, achats de test admis). Destiné UNIQUEMENT au canal « Test interne » de Play Console,
# envoyé à la main par le propriétaire. JAMAIS en production : le nom de version le dit, et le serveur de production est absent du code.
# Déclenchement : à la demande, ou commit contenant [play-achats]. Rien n'est envoyé à Google Play par ce workflow.
on:
  workflow_dispatch:
  push:
    branches: [claude/ios-kmp]
permissions:
  contents: write
env:
  RECETTE_URL: https://smartcourse-recette-recette.up.railway.app
  PROD_URL: https://smartcourse-production-c7ce.up.railway.app
jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[play-achats]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Clé durable présente ?
        env:
          KS_B64: ${{ secrets.NATIF_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NATIF_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.NATIF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NATIF_KEY_PASSWORD }}
          CERT: ${{ secrets.NATIF_CERT_SHA256 }}
        run: |
          miss=""; for v in KS_B64 KS_PASS KS_ALIAS KEY_PASS CERT; do [ -n "${!v}" ] || miss="$miss $v"; done
          [ -z "$miss" ] || { echo "::error::Secrets manquants :$miss"; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Composants Android (SDK 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" | tail -2
      - name: Serveur de recette joignable, achats par plateforme présents (lecture seule)
        run: |
          H=$(curl -fsS -m 20 "$RECETTE_URL/health"); echo "$H"
          echo "$H" | grep -qE '"schema":"0(3[4-9]|[4-9][0-9])' || { echo "::error::recette sans la migration 034"; exit 1; }
      - name: Code de version strictement supérieur à toutes les versions publiées
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          MAX=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].body' | grep -oE 'Code de version : [0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          VC=$(( ${MAX:-1196} + 1 ))
          echo "Plus haut code de version publié : ${MAX:-aucun} ; version de test : $VC"
          echo "VC=$VC" >> "$GITHUB_ENV"; echo "VN=1.1.0-test-achats-$VC" >> "$GITHUB_ENV"
      - name: Android App Bundle (release, clé durable, serveur de recette)
        working-directory: android-native
        env:
          KS_B64: ${{ secrets.NATIF_KEYSTORE_B64 }}
          NATIF_KEYSTORE_PASSWORD: ${{ secrets.NATIF_KEYSTORE_PASSWORD }}
          NATIF_KEY_ALIAS: ${{ secrets.NATIF_KEY_ALIAS }}
          NATIF_KEY_PASSWORD: ${{ secrets.NATIF_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          umask 077; echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/natif.keystore"
          export NATIF_KEYSTORE_FILE="$RUNNER_TEMP/natif.keystore"
          ./gradlew --no-daemon bundleRelease -Pfinal=1 -PserverUrl="$RECETTE_URL" -PversionCode=$VC -PversionName="$VN"
          rm -f "$NATIF_KEYSTORE_FILE"
          mkdir -p ../dist; cp app/build/outputs/bundle/release/app-release.aab "../dist/MesCourses-$VN.aab"
          J=$(gh api repos/google/bundletool/releases/latest --jq '.assets[] | select(.name | test("^bundletool-all-.*\\.jar$")) | .browser_download_url' | head -1)
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "$J"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="../dist/MesCourses-$VN.aab" | head -3
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="../dist/MesCourses-$VN.aab" > /tmp/manifest.xml
          mkdir -p /tmp/aab && (cd /tmp/aab && unzip -qo "$GITHUB_WORKSPACE/dist/MesCourses-$VN.aab" 'base/dex/*')
      - name: Contrôles (identifiant, version, signature durable, permission d'achat, serveur de RECETTE seulement)
        env:
          CERT: ${{ secrets.NATIF_CERT_SHA256 }}
        run: |
          set -e
          AAB="dist/MesCourses-$VN.aab"
          grep -q 'package="app.smartcourse.courses.natif"' /tmp/manifest.xml
          grep -q "android:versionCode=\"$VC\"" /tmp/manifest.xml
          grep -q 'com.android.vending.BILLING' /tmp/manifest.xml || { echo "::error::permission d'achat Google Play absente"; exit 1; }
          WANT=$(echo "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')
          FPA=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ': ' | tr 'A-F' 'a-f')
          [ "$FPA" = "$WANT" ] || { echo "::error::empreinte différente de NATIF_CERT_SHA256"; exit 1; }
          strings -a /tmp/aab/base/dex/*.dex | grep -q "$RECETTE_URL" || { echo "::error::serveur de recette absent"; exit 1; }
          ! strings -a /tmp/aab/base/dex/*.dex | grep -q "$PROD_URL" || { echo "::error::serveur de PRODUCTION présent dans une version de test"; exit 1; }
          (cd dist && sha256sum "MesCourses-$VN.aab" | tee sha256.txt)
      - uses: actions/upload-artifact@v4
        with: { name: android-test-achats, path: dist/ }
      - name: Pré-version GitHub (pas Google Play)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="courses-natif-test-achats-$VC"
          printf '%s\n' "VERSION DE TEST DES ACHATS — canal « Test interne » de Play Console UNIQUEMENT. NE JAMAIS PROMOUVOIR EN PRODUCTION." "" \
            "- Identifiant : app.smartcourse.courses.natif" "- Serveur : $RECETTE_URL (recette, données fictives)" "- Code de version : $VC" \
            "- Nom de version : $VN" "- SHA-256 :" "$(sed 's/^/  /' dist/sha256.txt)" > /tmp/notes.md
          gh release create "$TAG" "dist/MesCourses-$VN.aab" --prerelease --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Mes Courses $VN — TEST DES ACHATS (recette), test interne uniquement" --notes-file /tmp/notes.md
