name: Spot publicitaire — séquences vidéo de l'application réelle (famille fictive)
# Enregistre les séquences A à L du spot sur Android 16 avec la version candidate (même code que l'APK final, -Pfinal=1), sur une
# recette LOCALE et jetable remplie de données FICTIVES. Aucun accès à la production, aucun envoi vers Google Play.
# Lancement : envoi sur claude/demo-pub dont le message contient [demo] ([demo:A,C] pour quelques séquences).
on:
  workflow_dispatch:
    inputs:
      sequences:
        description: "Séquences (vide = toutes, ex. A,C,G)"
        required: false
        default: ""
  push:
    branches: [claude/demo-pub]
permissions:
  contents: read
env:
  VERSION_NAME: "1.0.2"
jobs:
  sequences:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[demo')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      # Même APK de test que native-play.yml (même clé de cache : même code Android, même serveur local de l'émulateur).
      - name: APK final de test déjà compilé ?
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: dist/
          key: apk-final-test-${{ hashFiles('android-native/**') }}-final1-srv-10.0.2.2-3000-v${{ env.VERSION_NAME }}-test-vc1-sig-essai-jetable
      - uses: actions/setup-java@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: APK final de TEST (serveur local de l'émulateur, clé jetable — jamais distribué)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: android-native
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" | tail -2
          export NATIF_KEYSTORE_FILE=/tmp/test-final.p12 NATIF_KEYSTORE_PASSWORD=essai-final NATIF_KEY_ALIAS=essai NATIF_KEY_PASSWORD=essai-final
          keytool -genkeypair -noprompt -keystore $NATIF_KEYSTORE_FILE -storetype PKCS12 -alias essai -keyalg RSA -keysize 2048 -validity 2 -storepass essai-final -keypass essai-final -dname "CN=Essai version finale non distribuable"
          ./gradlew --no-daemon assembleRelease -Pfinal=1 -PserverUrl=http://10.0.2.2:3000 -PversionCode=1 -PversionName="$VERSION_NAME-test"
          mkdir -p ../dist && cp app/build/outputs/apk/release/*.apk ../dist/Courses-final-test.apk
      - name: Recette locale jetable (Famille Martin fictive)
        run: SEED_PLAY=1 NO_TUNNEL=1 scripts/recette-locale.sh >/dev/null
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Séquences
        id: seq
        env: { MSG: "${{ github.event.head_commit.message }}", IN: "${{ inputs.sequences }}" }
        run: |
          S="$IN"; [ -n "$S" ] || S=$(echo "$MSG" | grep -oE '\[demo:[A-L,]+\]' | head -1 | sed -E 's/\[demo:([A-L,]+)\]/\1/')
          echo "list=$S" >> "$GITHUB_OUTPUT"; echo "Séquences : ${S:-toutes}"
      - name: Enregistrement sur Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/native-demo-pub.sh dist/Courses-final-test.apk demo-pub
        env:
          SEQUENCES: ${{ steps.seq.outputs.list }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: demo-pub, path: demo-pub/ }
      - name: Pré-version GitHub (fichiers du spot ; rien n'est publié ailleurs)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -d demo-pub/videos ] || exit 0
          (cd demo-pub && zip -qr ../spot-mes-courses-videos.zip videos resultats.txt diag && zip -qr ../spot-mes-courses-images.zip images)
          TAG="spot-mes-courses-${{ github.run_number }}"
          gh release create "$TAG" spot-mes-courses-videos.zip spot-mes-courses-images.zip demo-pub/resultats.txt --prerelease \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Spot Mes Courses — séquences (run ${{ github.run_number }})" \
            --notes "Séquences vidéo et images de l'application réelle (version candidate), famille fictive, recette locale jetable. Aucune donnée réelle."
      - run: scripts/recette-locale.sh --stop
        if: always()
