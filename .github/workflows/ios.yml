name: iPhone (Kotlin Multiplatform) — compilation et contrôles
# Branche dédiée claude/ios-kmp. Mac GitHub Actions : aucun Mac nécessaire chez l'utilisateur. Aucun accès à la production.
on:
  workflow_dispatch:
  push:
    branches: [claude/ios-kmp]
    paths: ['ios/**', 'android-native/**', 'scripts/ios-*', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  # Revalidation Android : les fichiers partagés ont changé ; mêmes tests unitaires et même compilation qu'avant.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires Android (inchangés)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compilation Android (recette)
        run: ./gradlew --no-daemon assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-gradle-${{ hashFiles('ios/**/*.kts', 'ios/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Images communes Android / iPhone
        run: python3 scripts/ios-gen-resources.py
      - name: Compilation iOS (sources Android communes + équivalents iPhone)
        working-directory: ios
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee ../ios-build.log || {
            echo "::error::Compilation iOS en échec"; grep -E '^e: ' ../ios-build.log | sed -E 's#file://[^ ]*/(nativeproto|ios/shared)/#\1/#' | head -150; exit 1; }

  # ───── Parcours de l'étape 1 (sur demande : « [parcours] » dans le message de commit, ou lancement manuel) ─────
  # Linux : serveur de recette jetable (données fictives) + tunnel HTTPS temporaire + application Android (émulateur).
  # Mac : application iPhone (simulateur) sur le MÊME serveur, par le tunnel. Les deux se retrouvent par un statut du commit.
  # Revalidation Android de bout en bout des écrans partagés modifiés (notifications et rappels, déconnexion) : parcours COMPLET de
  # la version finale Android (scripts/native-e2e-final.sh, le même que pour Google Play), APK final de TEST (clé jetable, serveur
  # local de l'émulateur — jamais distribué). Seulement avec [android-e2e] ou à la demande.
  android-e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Mêmes groupes indépendants que le workflow Google Play (chacun part d'une recette neuve), plus Q (rappels d'achat).
    strategy:
      fail-fast: false
      matrix:
        # [android-e2e:F,P,J] dans le message : ce seul groupe.
        # [android-e2e:connexion] : groupes passant par l'écran de connexion (F,G,H et C,D).
        # [android-e2e:Z] : mise à jour de l'application seulement.
        sections: ${{ fromJSON(contains(github.event.head_commit.message, '[android-e2e:Z]') && '["Z"]' || (contains(github.event.head_commit.message, '[android-e2e:F,P,J]') && '["F,P,J"]' || (contains(github.event.head_commit.message, '[android-e2e:connexion]') && '["F,G,H","C,D"]' || '["F,G,H","C,D","F,P,J","K,S","A","T","Q","Z"]'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Composants Android (SDK 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" | tail -2
      - name: APK final de TEST (serveur local de l'émulateur, clé jetable — jamais distribué)
        working-directory: android-native
        run: |
          export NATIF_KEYSTORE_FILE=/tmp/test-final.p12 NATIF_KEYSTORE_PASSWORD=essai-final NATIF_KEY_ALIAS=essai NATIF_KEY_PASSWORD=essai-final
          keytool -genkeypair -noprompt -keystore $NATIF_KEYSTORE_FILE -storetype PKCS12 -alias essai -keyalg RSA -keysize 2048 -validity 2 -storepass essai-final -keypass essai-final -dname "CN=Essai version finale non distribuable"
          ./gradlew --no-daemon assembleRelease -Pfinal=1 -PserverUrl=http://10.0.2.2:3000 -PversionCode=1 -PversionName="ios-e2e-test"
          mkdir -p ../dist && cp app/build/outputs/apk/release/*.apk ../dist/Courses-final-test.apk
      - name: Application d'essai « WhatsApp » (identifiant com.whatsapp, sans code ; émulateur de recette uniquement)
        run: |
          set -e; D=/tmp/wa; mkdir -p $D; B="$ANDROID_HOME/build-tools/36.0.0"
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.whatsapp" android:versionCode="1" android:versionName="essai">' \
            '  <application android:hasCode="false" android:label="WhatsApp (essai)">' \
            '    <activity android:name="android.app.Activity" android:exported="true">' \
            '      <intent-filter><action android:name="android.intent.action.SEND"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="text/plain"/></intent-filter>' \
            '    </activity>' '  </application>' '</manifest>' > $D/AndroidManifest.xml
          "$B/aapt2" link --manifest $D/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" --min-sdk-version 26 --target-sdk-version 36 -o $D/u.apk
          "$B/zipalign" -f 4 $D/u.apk $D/a.apk
          keytool -genkeypair -noprompt -keystore $D/k.p12 -storetype PKCS12 -alias s -keyalg RSA -keysize 2048 -validity 2 -storepass essai-wa -keypass essai-wa -dname "CN=Essai WhatsApp"
          "$B/apksigner" sign --ks $D/k.p12 --ks-pass pass:essai-wa --out dist/whatsapp-essai.apk $D/a.apk
      - name: Serveur local jetable
        run: |
          NO_TUNNEL=1 scripts/recette-locale.sh | tee /tmp/recette.out
          echo "FAMILY_CODE=$(grep -oE 'Code famille : [A-Z0-9]+' /tmp/recette.out | awk '{print $4}')" >> "$GITHUB_ENV"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Parcours ${{ matrix.sections }} de la version finale Android (Android 16)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/native-e2e-final.sh dist/Courses-final-test.apk ${{ env.FAMILY_CODE }} native-final
        env:
          SECTIONS: ${{ matrix.sections }}
          WA_STUB: dist/whatsapp-essai.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "android-e2e-${{ strategy.job-index }}", path: native-final/ }
      - run: scripts/recette-locale.sh --stop
        if: always()

  recette-android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[parcours]')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions: { contents: read, statuses: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: APK de recette Android (mêmes sources que l'iPhone)
        working-directory: android-native
        run: ./gradlew --no-daemon assembleRelease -PversionCode=1 -PversionName=ios-parcours && mkdir -p ../dist && cp app/build/outputs/apk/release/*.apk ../dist/recette.apk
      - name: Serveur de recette jetable + tunnel ; adresse publiée pour le Mac
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          scripts/recette-locale.sh | tee /tmp/recette.out
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/recette.out | head -1)
          CODE=$(grep -oE 'Code famille : [A-Z0-9]+' /tmp/recette.out | awk '{print $4}')
          echo "FAMILY_CODE=$CODE" >> "$GITHUB_ENV"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"ios-recette\",\"description\":\"$URL $CODE\"}" >/dev/null
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Android connecté ; attend l'ajout fait sur l'iPhone et le vérifie à l'écran
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ios-sync-android.sh dist/recette.apk ${{ env.FAMILY_CODE }} ios-sync-android 40
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-sync-android, path: ios-sync-android/ }
      - name: Serveur commun gardé jusqu'à la fin des contrôles iPhone (l'iPhone attend encore « Bananes »)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for _ in $(seq 1 135); do
            D=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" | jq -r '[.[]|select(.context=="ios-fin")][0].state // empty')
            [ -n "$D" ] && { echo "contrôles iPhone terminés"; break; }; sleep 20
          done
      - if: always()
        run: scripts/recette-locale.sh --stop

  parcours-iphone:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[parcours]')
    runs-on: macos-15
    timeout-minutes: 130
    permissions: { contents: read, statuses: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-gradle-${{ hashFiles('ios/**/*.kts', 'ios/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Projet Xcode (XcodeGen)
        working-directory: ios/app
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Simulateur iPhone disponible sur cette machine
        run: |
          # iPhone 16 sous iOS 18 (écran de 6,1 pouces), créé pour ce contrôle : même taille d'écran à chaque exécution.
          RT=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['name'].startswith('iOS 18')]; r.sort(key=lambda x:x['version']); print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create "iPhone 16 Courses" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RT")
          echo "SIM=$UDID" >> "$GITHUB_ENV"; xcrun simctl list devices available | grep "$UDID"
          # Simulateur neuf : sans l'écran d'introduction du clavier (« Speed up your typing… »), qui recouvre les touches.
          xcrun simctl boot "$UDID" || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true
      - name: Compilation de l'application iPhone et de ses contrôles (simulateur)
        working-directory: ios/app
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Courses.xcodeproj -scheme Courses -destination "id=$SIM" \
            -derivedDataPath ../build/dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= 2>&1 | tee ../xcodebuild.log | grep -E "error:|warning: .*Courses|BUILD|\*\*" | head -80
      - name: Attente du serveur de recette (adresse publiée par la tâche Linux)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for _ in $(seq 1 120); do
            D=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" | jq -r '[.[]|select(.context=="ios-recette")][0].description // empty')
            [ -n "$D" ] && break; sleep 20
          done
          [ -n "$D" ] || { echo "::error::serveur de recette non publié"; exit 1; }
          echo "COURSES_SERVER=${D% *}" >> "$GITHUB_ENV"; echo "COURSES_FAMILY=${D#* }" >> "$GITHUB_ENV"
          echo "Serveur de recette : ${D% *}"
          # Flux en direct (SSE) au travers du tunnel, vu depuis cette machine : chaque événement doit arriver tout de suite.
          U=${D% *}; J=$(mktemp)
          curl -fsS -c "$J" -H 'Content-Type: application/json' -d "{\"familyCode\":\"${D#* }\",\"login\":\"marie\",\"secret\":\"573918\"}" "$U/api/auth/login" >/dev/null \
            && { timeout 40 curl -sN -b "$J" -H 'Accept: text/event-stream' "$U/api/events" | while IFS= read -r l; do case "$l" in event:*) echo "$(date -u +%T) $l";; esac; done; echo "fin de la sonde du flux"; } \
            || echo "sonde du flux : connexion impossible"
          rm -f "$J"
      - name: Parcours iPhone croisé avec Android (sens 1 puis sens 2)
        working-directory: ios/app
        env:
          TEST_RUNNER_COURSES_SERVER: ${{ env.COURSES_SERVER }}
          TEST_RUNNER_COURSES_FAMILY: ${{ env.COURSES_FAMILY }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Courses.xcodeproj -scheme Courses -destination "id=$SIM" \
            -derivedDataPath ../build/dd -resultBundlePath ../parcours.xcresult 2>&1 | tee ../xctest.log | grep -vE "^\s*(export|cd) |^\s*$" | tail -150
      - name: Fin des contrôles iPhone signalée (le serveur de recette peut s'arrêter)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"ios-fin","description":"contrôles iPhone terminés"}' >/dev/null || true
      - name: Captures d'écran du parcours
        if: always()
        run: |
          mkdir -p ios/captures
          xcrun xcresulttool export attachments --path ios/parcours.xcresult --output-path ios/captures 2>/dev/null || true
          ls -la ios/captures | head -30
          echo "── Correspondance des captures"; cat ios/captures/manifest.json 2>/dev/null | head -80
          # Captures réduites (JPEG 360 px) imprimées dans le journal, pour pouvoir les examiner sans télécharger d'artefact.
          for p in ios/captures/*.png; do
            sips -Z 360 -s format jpeg -s formatOptions 55 "$p" --out /tmp/s.jpg >/dev/null 2>&1 || continue
            echo "CAPTURE-DEBUT $(basename "$p")"; base64 -i /tmp/s.jpg | fold -w 180; echo "CAPTURE-FIN"
          done
          echo "── Arborescence de l'application vue par le test"
          for f in ios/captures/*.txt; do grep -l "Application" "$f" >/dev/null 2>&1 && { head -60 "$f"; break; }; done
          echo "── Messages de l'application sur le simulateur (10 dernières minutes)"
          xcrun simctl spawn "$SIM" log show --last 90m --style compact --predicate 'process == "Courses"' 2>/dev/null | grep -E "\[Courses|error|Error|failed" | grep -v "xctest" | tail -80 || true
          xcrun simctl list devices booted | head -5
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i courses | head; for f in ~/Library/Logs/DiagnosticReports/Courses*; do [ -f "$f" ] && head -60 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parcours-iphone, path: "ios/captures/\nios/xctest.log\nios/xcodebuild.log" }
