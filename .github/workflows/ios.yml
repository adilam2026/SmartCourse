name: iPhone (Kotlin Multiplatform) — compilation et contrôles
# Branche dédiée claude/ios-kmp. Mac GitHub Actions : aucun Mac nécessaire chez l'utilisateur. Aucun accès à la production.
on:
  workflow_dispatch:
  push:
    branches: [claude/ios-kmp]
    paths: ['ios/**', 'android-native/**', 'scripts/ios-*', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  # Revalidation Android : les fichiers partagés ont changé ; mêmes tests unitaires et même compilation qu'avant.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: android-native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires Android (inchangés)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compilation Android (recette)
        run: ./gradlew --no-daemon assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-gradle-${{ hashFiles('ios/**/*.kts', 'ios/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Images communes Android / iPhone
        run: python3 scripts/ios-gen-resources.py
      - name: Compilation iOS (sources Android communes + équivalents iPhone)
        working-directory: ios
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee ../ios-build.log || {
            echo "::error::Compilation iOS en échec"; grep -E '^e: ' ../ios-build.log | sed -E 's#file://[^ ]*/(nativeproto|ios/shared)/#\1/#' | head -150; exit 1; }
