name: Correctif ville des profils - contrôles ciblés
on:
  push:
    branches: [codex/fix-profile-family-city]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smartcourse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart -d smartcourse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/profile-family-city.test.ts test/location.test.ts test/city-listdelete.test.ts
