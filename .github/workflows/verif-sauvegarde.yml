name: Sauvegarde de production — restauration de contrôle dans une base isolée
# Lit la plus récente sauvegarde CHIFFRÉE de production dans son stockage, la restaure dans un serveur PostgreSQL JETABLE créé
# pour ce contrôle (conteneur local de cette exécution, détruit à la fin), puis compare au manifeste : lignes de chaque table,
# migrations, invariants métier, photos de la famille. La base de production n'est JAMAIS une destination : son adresse n'est pas
# fournie et le programme refuse toute cible autre que le serveur jetable local. Aucune écriture dans le stockage.
# Journal public : dates, nombres et résultats seulement (aucun hôte, nom de stockage ni secret).
# Secrets GitHub nécessaires (Settings → Secrets and variables → Actions), copiés depuis les variables Railway du service :
#   SAUVEGARDE_BACKUP_KEY, SAUVEGARDE_S3_BUCKET, SAUVEGARDE_S3_ENDPOINT, SAUVEGARDE_S3_REGION,
#   SAUVEGARDE_S3_ACCESS_KEY_ID, SAUVEGARDE_S3_SECRET_ACCESS_KEY
# Lancement : un envoi sur claude/evolutions-avancees dont le message contient [verif-sauvegarde] (ou lancement manuel).
on:
  workflow_dispatch:
  push:
    branches: [claude/evolutions-avancees]
permissions:
  contents: read
jobs:
  restauration:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verif-sauvegarde]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents (sans les afficher)
        env:
          K: ${{ secrets.SAUVEGARDE_BACKUP_KEY }}
          B: ${{ secrets.SAUVEGARDE_S3_BUCKET }}
          A: ${{ secrets.SAUVEGARDE_S3_ACCESS_KEY_ID }}
          S: ${{ secrets.SAUVEGARDE_S3_SECRET_ACCESS_KEY }}
        run: |
          miss=""; [ -n "$K" ] || miss="$miss SAUVEGARDE_BACKUP_KEY"; [ -n "$B" ] || miss="$miss SAUVEGARDE_S3_BUCKET"
          [ -n "$A" ] || miss="$miss SAUVEGARDE_S3_ACCESS_KEY_ID"; [ -n "$S" ] || miss="$miss SAUVEGARDE_S3_SECRET_ACCESS_KEY"
          [ -z "$miss" ] || { echo "::error::secrets GitHub manquants :$miss"; exit 1; }
          echo "Secrets présents."
      - name: Image du serveur (outils pg_restore 16, 17, 18) et serveur PostgreSQL jetable
        run: |
          . scripts/lib-docker.sh
          docker_build smartcourse:verif
          docker network create verif-net
          PG=$(docker_image postgres:18)
          docker run -d --name restore-pg --network verif-net -e POSTGRES_USER=verif -e POSTGRES_PASSWORD=verif -e POSTGRES_DB=verif "$PG" >/dev/null
          for _ in $(seq 1 60); do docker exec restore-pg pg_isready -U verif -d verif >/dev/null 2>&1 && break; sleep 1; done
      - name: Restauration de contrôle de la sauvegarde la plus récente
        env:
          BACKUP_KEY: ${{ secrets.SAUVEGARDE_BACKUP_KEY }}
          S3_BUCKET: ${{ secrets.SAUVEGARDE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.SAUVEGARDE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.SAUVEGARDE_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.SAUVEGARDE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SAUVEGARDE_S3_SECRET_ACCESS_KEY }}
        run: |
          docker run --rm --network verif-net -e BACKUP_KEY -e S3_BUCKET -e S3_ENDPOINT -e S3_REGION -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            -e RESTORE_TARGET_URL=postgres://verif:verif@restore-pg:5432/verif smartcourse:verif node dist/backup-isolated.js | tee bilan.txt
      - name: Nettoyage (serveur jetable détruit)
        if: always()
        run: docker rm -f restore-pg >/dev/null 2>&1; docker network rm verif-net >/dev/null 2>&1; true
