name: Recette V3 sur téléphone (manuelle, temporaire, sans Railway)
# Lance l'application DE CETTE BRANCHE dans un environnement jetable (base vide + famille d'essai) avec une adresse HTTPS temporaire
# (tunnel Cloudflare gratuit), à ouvrir sur un téléphone. Aucun secret, aucun accès à Railway, AUCUNE donnée réelle : la production
# n'est ni touchée ni visible depuis cet environnement. Tout est effacé à la fin (durée choisie, 120 minutes au plus).
# Attention : le dépôt est public, donc le journal de cette exécution aussi. Il ne contient que l'adresse temporaire et des
# identifiants d'essai sans valeur ; ne pas y saisir de vraies données.
# Sur le téléphone : ouvrir l'adresse, se connecter en administrateur (adil), Réglages → Aperçu V3 → activer ; se reconnecter en
# personnel (marie) pour voir le parcours de sélection.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de l'environnement d'essai, en minutes (10 à 120)"
        default: "60"
permissions:
  contents: read
jobs:
  recette:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Démarrage de l'environnement d'essai
        run: |
          M="${{ inputs.minutes }}"; case "$M" in ''|*[!0-9]*) M=60;; esac
          [ "$M" -lt 10 ] && M=10; [ "$M" -gt 120 ] && M=120
          echo "MINUTES=$M" >> "$GITHUB_ENV"
          scripts/recette-locale.sh | tee /tmp/recette.out
          URL=$(grep -oE 'Application prête : https://[a-z0-9-]+\.trycloudflare\.com' /tmp/recette.out | awk '{print $4}')
          CODE=$(grep -oE 'Code famille : [A-Z0-9]+' /tmp/recette.out | awk '{print $4}')
          { echo "## Recette V3 (environnement jetable, $M minutes)"; echo; echo "- Adresse : $URL"; echo "- Code famille : $CODE"; echo "- Administrateur : adil / 482913 · Personnel : marie / 573918 · Parent : lamiaa / 573918"; echo "- Activer la V3 : connexion en adil → Réglages → Aperçu V3."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Environnement ouvert (attente)
        run: |
          echo "Environnement ouvert pendant $MINUTES minutes. Annuler l'exécution pour l'arrêter plus tôt."
          sleep $((MINUTES * 60))
      - name: Arrêt et effacement
        if: always()
        run: scripts/recette-locale.sh --stop
