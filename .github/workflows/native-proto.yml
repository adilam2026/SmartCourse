name: Prototype Android natif (manuel, sans déploiement)
# Ne se lance que sur demande. Compile le module android-native (Kotlin + Jetpack Compose),
# l'exécute sur un émulateur Android, capture les écrans réels et publie l'APK d'essai.
# Aucun secret, aucun accès à Railway, aucune donnée réelle : l'application n'a aucune permission réseau.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Composants Android (SDK 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" | tail -2
      - name: Clé de signature jetable (essai)
        run: |
          F="$RUNNER_TEMP/proto.jks"; P=$(openssl rand -hex 16); echo "::add-mask::$P"
          keytool -genkeypair -noprompt -keystore "$F" -storetype PKCS12 -alias proto -keyalg RSA -keysize 2048 -validity 90 -storepass "$P" -keypass "$P" -dname "CN=Courses natif ESSAI" >/dev/null 2>&1
          echo "PROTO_KEYSTORE_PATH=$F" >> "$GITHUB_ENV"; echo "PROTO_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
          echo "PROTO_KEY_ALIAS=proto" >> "$GITHUB_ENV"; echo "PROTO_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
      - name: Compilation de l'APK (release, R8)
        working-directory: android-native
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName="0.1-proto.${{ github.run_number }}"
      - name: Contrôles de l'APK
        run: |
          set -e
          APK=$(ls android-native/app/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Verifies|SHA-256" | head -3
          grep -E "^package:" /tmp/badging.txt
          echo "--- permissions déclarées :"; grep -c "uses-permission" /tmp/badging.txt || true
          ! grep -q "uses-permission" /tmp/badging.txt   # aucune permission, donc aucun accès réseau
          grep -q "name='app.smartcourse.courses.nativeproto'" /tmp/badging.txt
          # Architecture : pas de WebView / TWA / Capacitor dans l'APK
          mkdir -p /tmp/dex && cd /tmp/dex && unzip -qo "$GITHUB_WORKSPACE/$APK" 'classes*.dex'
          for pat in androidbrowserhelper customtabs capacitor cordova; do
            if strings -a /tmp/dex/classes*.dex | grep -qi "$pat"; then echo "::error::trace de $pat dans l'APK"; exit 1; fi
          done
          echo "WebView (références dans le dex) : $(strings -a /tmp/dex/classes*.dex | grep -c 'android/webkit/WebView' || true)" | tee /tmp/webview.txt
          ls -l "$GITHUB_WORKSPACE/$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp "$GITHUB_WORKSPACE/$APK" "$GITHUB_WORKSPACE/dist/CoursesNatif-proto.apk"
          cp /tmp/badging.txt "$GITHUB_WORKSPACE/dist/badging.txt"; cp /tmp/webview.txt "$GITHUB_WORKSPACE/dist/webview.txt"
      - name: Bibliothèques embarquées (preuve d'architecture)
        working-directory: android-native
        run: ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath | grep -E "^\+---|^\\\\---" | sed 's/ (\*)//' | sort -u > ../dist/dependances.txt; ! grep -iE "webkit|browser|capacitor|cordova" ../dist/dependances.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  captures:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android et captures réelles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/native-captures.sh dist/CoursesNatif-proto.apk native-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: native-captures/

  publier:
    needs: [build, captures]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: captures
          path: native-captures
      - name: Captures dans le dépôt (branche android-native uniquement)
        run: |
          rm -rf docs/native/captures && mkdir -p docs/native/captures
          cp native-captures/* docs/native/captures/
          mkdir -p docs/native/preuves && cp dist/badging.txt dist/webview.txt dist/dependances.txt docs/native/preuves/
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/native
          git commit -m "Prototype natif : captures réelles de l'émulateur (run ${{ github.run_number }}) [skip ci]" || echo "rien à commiter"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
      - name: Publication de l'APK d'essai (préversion, hors production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-proto-${{ github.run_number }}" dist/CoursesNatif-proto.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Courses natif — prototype visuel ${{ github.run_number }} (données fictives)" \
            --notes "APK de démonstration du prototype Android natif (Kotlin + Jetpack Compose). Identifiant distinct app.smartcourse.courses.nativeproto : s'installe à côté de l'application actuelle. Données fictives locales, aucune permission réseau, aucune donnée réelle. Signature jetable d'essai : ne pas distribuer."
