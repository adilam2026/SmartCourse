name: Android natif — clé de signature durable (essai, création unique, reprise)
# Lancement manuel uniquement. Trois modes :
#   essai     : vérifie tout (jetons, dépôt de sauvegarde PRIVÉ, phrase, état) et teste réellement les deux écritures
#               (un fichier d'essai dans le dépôt privé, un secret d'essai dans SmartCourse, tous deux supprimés aussitôt).
#               AUCUNE clé n'est générée.
#   creer     : création UNIQUE. Refusée si une clé est déjà enregistrée OU si une sauvegarde existe déjà (→ « reprendre »).
#               Sauvegarde chiffrée déposée, relue et déchiffrée AVANT d'enregistrer les secrets.
#   reprendre : la même clé, depuis la sauvegarde existante : relecture, déchiffrement, contrôle de l'empreinte, puis
#               (ré)enregistrement des cinq secrets avec ces mêmes valeurs. Ne génère jamais de nouvelle clé.
# Ce dépôt est public : rien de secret n'apparaît dans les journaux, le dépôt, les releases ni les artifacts.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "essai (aucune clé), creer (création unique) ou reprendre (même clé, depuis la sauvegarde)"
        type: choice
        options: [essai, creer, reprendre]
        default: essai
      confirmation:
        description: "Pour creer : CRÉER ; pour reprendre : REPRENDRE ; vide pour essai"
        required: false
        default: ""
  # Envoi de CE fichier : toujours un essai (aucun champ de mode → « essai » ; jamais de génération).
  push:
    branches: [claude/android-native]
    paths: ['.github/workflows/natif-cle.yml']
# Une seule exécution à la fois, quel que soit le mode ; une seconde attend la fin de la première (jamais annulée en cours).
concurrency:
  group: natif-cle-signature
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'essai' }}
      REPO: ${{ github.repository }}
      BACKUP_REPO: ${{ github.repository_owner }}/smartcourse-cles
      ALIAS: courses-natif
    steps:
      - name: 1. Vérifications (tous les modes, avant toute génération)
        env:
          CONFIRM: ${{ inputs.confirmation }}
          SECRETS_TOKEN: ${{ secrets.NATIF_SECRETS_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.NATIF_BACKUP_TOKEN }}
          PASSPHRASE: ${{ secrets.NATIF_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "Mode : $MODE"
          case "$MODE" in
            creer) [ "$CONFIRM" = "CRÉER" ] || { echo "::error::Confirmation attendue : CRÉER"; exit 1; } ;;
            reprendre) [ "$CONFIRM" = "REPRENDRE" ] || { echo "::error::Confirmation attendue : REPRENDRE"; exit 1; } ;;
          esac
          for v in SECRETS_TOKEN BACKUP_TOKEN PASSPHRASE; do [ -n "${!v}" ] || { echo "::error::Secret manquant : NATIF_${v/PASSPHRASE/BACKUP_PASSPHRASE}"; exit 1; }; done
          [ ${#PASSPHRASE} -ge 16 ] || { echo "::error::NATIF_BACKUP_PASSPHRASE doit faire au moins 16 caractères."; exit 1; }
          GH_TOKEN="$SECRETS_TOKEN" gh api "repos/$REPO/actions/secrets" --jq '.secrets[].name' > /tmp/existants || { echo "::error::NATIF_SECRETS_TOKEN ne donne pas accès aux secrets de $REPO (permission « Secrets : Read and write »)."; exit 1; }
          INFO=$(GH_TOKEN="$BACKUP_TOKEN" gh api "repos/$BACKUP_REPO") || { echo "::error::Dépôt $BACKUP_REPO introuvable avec NATIF_BACKUP_TOKEN."; exit 1; }
          [ "$(echo "$INFO" | jq -r .private)" = true ] || { echo "::error::$BACKUP_REPO n'est pas privé : refusé."; exit 1; }
          GH_TOKEN="$BACKUP_TOKEN" gh api "repos/$BACKUP_REPO/contents/" --jq '.[].name' 2>/dev/null | grep -E '^courses-natif-cle-.*\.7z$' > /tmp/sauvegardes || true
          NB=$(wc -l < /tmp/sauvegardes | tr -d ' ')
          CLE=$(grep -cx "NATIF_KEYSTORE_B64" /tmp/existants || true)
          echo "État : clé enregistrée dans les secrets = $([ "$CLE" = 1 ] && echo oui || echo non) ; sauvegardes chiffrées = $NB"
          command -v 7z >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null; }
          case "$MODE" in
            creer)
              [ "$CLE" = 0 ] || { echo "::error::Une clé est DÉJÀ enregistrée : elle est conservée pour toutes les mises à jour. Rien n'est créé."; exit 1; }
              [ "$NB" = 0 ] || { echo "::error::Une sauvegarde de clé existe déjà dans $BACKUP_REPO : utilisez le mode « reprendre » (même clé). Rien n'est créé."; exit 1; } ;;
            reprendre)
              [ "$NB" = 1 ] || { echo "::error::Reprise impossible : il faut exactement UNE sauvegarde dans $BACKUP_REPO (trouvées : $NB). Rien n'est modifié."; exit 1; } ;;
          esac
          echo "Vérifications réussies."

      - name: "Essai : écritures réelles sans clé (fichier et secret d'essai, supprimés aussitôt)"
        if: env.MODE == 'essai'
        env:
          SECRETS_TOKEN: ${{ secrets.NATIF_SECRETS_TOKEN }}
          BACKUP_TOKEN: ${{ secrets.NATIF_BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          F="essai-ecriture-${{ github.run_id }}.txt"
          SHA=$(GH_TOKEN="$BACKUP_TOKEN" gh api -X PUT "repos/$BACKUP_REPO/contents/$F" -f message="Essai d'écriture (supprimé aussitôt)" -f content="$(printf 'essai' | base64 -w0)" --jq .content.sha)
          GH_TOKEN="$BACKUP_TOKEN" gh api -X DELETE "repos/$BACKUP_REPO/contents/$F" -f message="Suppression de l'essai" -f sha="$SHA" >/dev/null
          echo "Écriture dans $BACKUP_REPO : OK (fichier d'essai créé puis supprimé)."
          printf 'essai' | GH_TOKEN="$SECRETS_TOKEN" gh secret set NATIF_ESSAI_ECRITURE --repo "$REPO"
          GH_TOKEN="$SECRETS_TOKEN" gh secret delete NATIF_ESSAI_ECRITURE --repo "$REPO"
          echo "Écriture des secrets de $REPO : OK (secret d'essai créé puis supprimé)."
          echo "ESSAI RÉUSSI : aucune clé générée, rien d'autre de modifié."

      - name: "Création : génération de la clé (rien n'est affiché)"
        if: env.MODE == 'creer'
        run: |
          set -euo pipefail
          umask 077; W="$RUNNER_TEMP/cle"; mkdir -p "$W"
          P=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$P"
          printf '%s' "$P" > "$W/motdepasse"
          keytool -genkeypair -noprompt -keystore "$W/courses-natif.keystore" -storetype PKCS12 -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Courses, O=SmartCourse, C=MA" >/dev/null 2>&1
          keytool -list -v -keystore "$W/courses-natif.keystore" -alias "$ALIAS" -storepass "$P" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' > "$W/empreinte"
          echo "Empreinte SHA-256 du certificat (publique) : $(cat "$W/empreinte")"

      - name: "Création : sauvegarde chiffrée déposée, relue et vérifiée"
        if: env.MODE == 'creer'
        env:
          BACKUP_TOKEN: ${{ secrets.NATIF_BACKUP_TOKEN }}
          PASSPHRASE: ${{ secrets.NATIF_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077; W="$RUNNER_TEMP/cle"; D="$W/sauvegarde"; mkdir -p "$D"
          cp "$W/courses-natif.keystore" "$D/"
          { echo "Courses — clé de signature Android (version native)"
            echo "Identifiant de l'application : app.smartcourse.courses.natif"
            echo "Fichier : courses-natif.keystore (PKCS12)"
            echo "Alias : $ALIAS"
            echo "Mot de passe (fichier et clé) : $(cat "$W/motdepasse")"
            echo "Empreinte SHA-256 : $(cat "$W/empreinte")"
            echo "Créée le : $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "Sans ce fichier ET ce mot de passe, aucune mise à jour de l'application n'est possible."; } > "$D/LISEZ-MOI-informations-cle.txt"
          NAME="courses-natif-cle-$(date -u +%Y%m%d).7z"
          (cd "$D" && 7z a -t7z -mhe=on -mx=9 -p"$PASSPHRASE" "$W/$NAME" courses-natif.keystore LISEZ-MOI-informations-cle.txt >/dev/null)
          base64 -w0 "$W/$NAME" > "$W/archive.b64"
          jq -n --rawfile c "$W/archive.b64" --arg m "Sauvegarde chiffrée de la clé Courses natif" '{message:$m, content:$c}' > "$W/req.json"
          GH_TOKEN="$BACKUP_TOKEN" gh api -X PUT "repos/$BACKUP_REPO/contents/$NAME" --input "$W/req.json" --jq .content.path >/dev/null
          GH_TOKEN="$BACKUP_TOKEN" gh api "repos/$BACKUP_REPO/contents/$NAME" -H "Accept: application/vnd.github.raw" > "$W/relu.7z"
          mkdir -p "$W/controle" && (cd "$W/controle" && 7z x -p"$PASSPHRASE" "$W/relu.7z" >/dev/null)
          cmp -s "$W/controle/courses-natif.keystore" "$W/courses-natif.keystore" || { echo "::error::La sauvegarde relue ne correspond pas : aucun secret n'est enregistré (relancer en « reprendre » après vérification)."; exit 1; }
          keytool -list -keystore "$W/controle/courses-natif.keystore" -storepass "$(cat "$W/motdepasse")" >/dev/null 2>&1 || { echo "::error::La sauvegarde relue ne s'ouvre pas : aucun secret n'est enregistré."; exit 1; }
          echo "Sauvegarde déposée dans $BACKUP_REPO ($NAME), relue et déchiffrée avec succès."

      - name: "Reprise : même clé, lue dans la sauvegarde et vérifiée"
        if: env.MODE == 'reprendre'
        env:
          BACKUP_TOKEN: ${{ secrets.NATIF_BACKUP_TOKEN }}
          PASSPHRASE: ${{ secrets.NATIF_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077; W="$RUNNER_TEMP/cle"; mkdir -p "$W/controle"
          NAME=$(cat /tmp/sauvegardes)
          GH_TOKEN="$BACKUP_TOKEN" gh api "repos/$BACKUP_REPO/contents/$NAME" -H "Accept: application/vnd.github.raw" > "$W/relu.7z"
          (cd "$W/controle" && 7z x -p"$PASSPHRASE" "$W/relu.7z" >/dev/null) || { echo "::error::Déchiffrement impossible : phrase de sauvegarde différente de celle de la création ?"; exit 1; }
          P=$(sed -n 's/^Mot de passe (fichier et clé) : //p' "$W/controle/LISEZ-MOI-informations-cle.txt")
          echo "::add-mask::$P"
          printf '%s' "$P" > "$W/motdepasse"
          cp "$W/controle/courses-natif.keystore" "$W/courses-natif.keystore"
          SAVED=$(sed -n 's/^Empreinte SHA-256 : //p' "$W/controle/LISEZ-MOI-informations-cle.txt")
          REAL=$(keytool -list -v -keystore "$W/courses-natif.keystore" -alias "$ALIAS" -storepass "$P" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          [ -n "$REAL" ] && [ "$REAL" = "$SAVED" ] || { echo "::error::La clé de la sauvegarde ne s'ouvre pas ou son empreinte ne correspond pas : rien n'est modifié."; exit 1; }
          printf '%s' "$REAL" > "$W/empreinte"
          echo "Sauvegarde $NAME relue : même clé, empreinte (publique) : $REAL"

      - name: "Enregistrement des cinq secrets NATIF_* (création ou reprise, après vérification)"
        if: env.MODE != 'essai'
        env:
          SECRETS_TOKEN: ${{ secrets.NATIF_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cle"; export GH_TOKEN="$SECRETS_TOKEN"
          # Valeurs identiques à chaque reprise : réenregistrer un secret déjà présent ne change pas la clé.
          base64 -w0 "$W/courses-natif.keystore" | gh secret set NATIF_KEYSTORE_B64 --repo "$REPO"
          gh secret set NATIF_KEYSTORE_PASSWORD --repo "$REPO" < "$W/motdepasse"
          gh secret set NATIF_KEY_PASSWORD --repo "$REPO" < "$W/motdepasse"
          printf '%s' "$ALIAS" | gh secret set NATIF_KEY_ALIAS --repo "$REPO"
          gh secret set NATIF_CERT_SHA256 --repo "$REPO" < "$W/empreinte"
          OK=$(gh api "repos/$REPO/actions/secrets" --jq '[.secrets[].name | select(. == "NATIF_KEYSTORE_B64" or . == "NATIF_KEYSTORE_PASSWORD" or . == "NATIF_KEY_ALIAS" or . == "NATIF_KEY_PASSWORD" or . == "NATIF_CERT_SHA256")] | length')
          [ "$OK" = 5 ] || { echo "::error::Seulement $OK secrets sur 5 présents : relancer en mode « reprendre »."; exit 1; }
          echo "Les cinq secrets NATIF_* sont enregistrés (même clé que la sauvegarde)."

      - name: Effacement des fichiers du runner
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/cle" ] && find "$RUNNER_TEMP/cle" -type f -exec shred -u {} + 2>/dev/null; rm -rf "$RUNNER_TEMP/cle" /tmp/existants /tmp/sauvegardes; echo "Fichiers temporaires effacés."
