name: Tests d'une version (serveur et web)
# Rejoue les tests du serveur (avec PostgreSQL jetable) et de l'application web sur un commit PRÉCIS, pour rattacher des
# résultats publics à une version. Aucune donnée réelle, aucun secret, aucun déploiement.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit à tester (SHA complet)"
        required: true
  # Ce fichier n'est pas sur la branche par défaut (lancement manuel impossible par l'API) : il s'exécute aussi à chaque envoi
  # sur la branche de travail qui touche le serveur, le web, le Dockerfile ou ce fichier, sur le commit envoyé.
  push:
    branches: [claude/unites-statistiques]
    paths: ['.github/workflows/tests-version.yml', 'Dockerfile', 'server/**', 'web/**']
permissions:
  contents: read
jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smartcourse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart -d smartcourse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha || github.sha }}" }
      - run: "git log -1 --format='Version testée %H — %s'"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4   # même Node que l'image de production (tzdata 2026e : Maroc UTC+0 depuis le 20/09/2026)
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Client pg_dump 16 (même version majeure que le serveur PostgreSQL de test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null && ls /usr/lib/postgresql
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      # 127.0.0.1 comme lors de la validation : les 2 tests TLS (réservés à « localhost » avec un serveur TLS) sont ignorés
      - run: npx vitest run
        env:
          TEST_DATABASE_URL: postgres://smart:smart@127.0.0.1:5432/smartcourse_test
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4   # même Node que l'image de production (tzdata 2026e : Maroc UTC+0 depuis le 20/09/2026)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
  image:
    # L'image Docker réellement construite pour la production (même Dockerfile que Railway) : construction (avec le contrôle
    # Africa/Casablanca intégré), version de Node et décalages du fuseau du foyer aux dates concernées.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.sha || github.sha }}" }
      - name: Construction de l'image de production
        run: . scripts/lib-docker.sh && docker_build smartcourse:version
      - name: Fuseau du foyer dans l'image
        run: |
          docker run --rm smartcourse:version node -e '
            const f = (i) => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Casablanca", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZoneName: "shortOffset" }).format(new Date(i));
            console.log("Node", process.version, "tzdata", process.versions.tz);
            for (const i of ["2026-01-15T07:00:00Z", "2026-03-01T07:00:00Z", "2026-09-19T07:00:00Z", "2026-09-21T07:00:00Z", "2026-10-20T07:00:00Z", "2027-06-15T07:00:00Z"]) console.log(i, "->", f(i));'
